<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemoryVault — Control Room (React)</title>
<style>
:root{--bg:#0a0c16;--panel:#12152a;--panel2:#171b34;--line:#242a4a;--ink:#eef0fb;
 --dim:#9aa3c7;--brand:#6b8afd;--brand2:#8b6bfd;--ok:#4fd68a;--warn:#f0b64d;--bad:#f0607a}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 system-ui,sans-serif;
 background:radial-gradient(1200px 600px at 80% -10%,#1a1f42 0%,var(--bg) 55%);color:var(--ink)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:22px;padding:14px 26px;
 background:rgba(10,12,22,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:18px;display:flex;gap:9px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 0 16px var(--brand)}
nav{display:flex;gap:4px}
nav button{background:transparent;border:0;color:var(--dim);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600}
nav button.active{color:#fff;background:linear-gradient(135deg,rgba(107,138,253,.25),rgba(139,107,253,.25));box-shadow:inset 0 0 0 1px var(--line)}
.gauge{margin-left:auto;display:flex;align-items:center;gap:12px}
.ring{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;position:relative}
.ring::after{content:'';position:absolute;width:34px;height:34px;border-radius:50%;background:var(--bg)}
.ring b{position:relative;z-index:1}
main{max-width:1100px;margin:0 auto;padding:24px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.4fr 1fr}
@media(max-width:900px){.g4,.g2{grid-template-columns:1fr 1fr}}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.k{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.v{font-size:30px;font-weight:800;margin-top:6px}.s{color:var(--dim);font-size:12px}
h1{font-size:22px;margin:2px 0}.sub{color:var(--dim);margin:0 0 16px}
input,select{background:#0d1024;border:1px solid var(--line);color:var(--ink);padding:11px 13px;border-radius:11px;outline:none}
.btn{background:linear-gradient(135deg,var(--brand),var(--brand2));border:0;color:#fff;padding:10px 15px;border-radius:11px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}.btn.red{background:linear-gradient(135deg,#e0556e,#a3324a)}.btn.sm{padding:6px 10px;font-size:12px}
.mem{border:1px solid var(--line);border-radius:13px;padding:14px;margin:10px 0;background:#0f1226}
.meta{color:var(--dim);font-size:12px;margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:#1b2140;border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:11px}
.chip.bad{color:var(--bad)}.chip.warn{color:var(--warn)}.chip.ok{color:var(--ok)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.empty{color:var(--dim);text-align:center;padding:40px}
.flow{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;color:var(--dim)}
.node{background:#151a34;border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--ink);font-weight:600}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#151a34;border:1px solid var(--line);padding:12px 18px;border-radius:12px;z-index:99}
</style>
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@18.3.1",
  "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
  "htm": "https://esm.sh/htm@3.1.1"
}}
</script>
</head>
<body>
<div id="root"><div class="empty">Loading the React Control Room…</div></div>
<script type="module">
import React, {useState,useEffect,useCallback} from "react";
import {createRoot} from "react-dom/client";
import htm from "htm";
const html = htm.bind(React.createElement);
const API = location.origin;
let KEY = localStorage.getItem("mv_key")||"";

async function api(path,opts={}){
  opts.headers=Object.assign({"x-api-key":KEY,"content-type":"application/json"},opts.headers||{});
  const r=await fetch(API+path,opts);
  if(!r.ok) throw new Error(r.status+" "+(await r.text()).slice(0,80));
  return r.status===204?null:r.json();
}

function Gauge({h}){
  if(!h) return html`<div class="ring"><b>—</b></div>`;
  const col=h.score>=85?"var(--ok)":h.score>=65?"var(--warn)":"var(--bad)";
  return html`<div class="ring" style=${{background:`conic-gradient(${col} ${h.score}%,var(--line) 0)`}}><b>${h.grade}</b></div>`;
}

function Overview({toast,reload}){
  const [d,setD]=useState(null);
  useEffect(()=>{Promise.all([api("/api/counts"),api("/api/health-score"),api("/api/insights?days=180"),api("/api/verify-chain")])
    .then(([counts,hs,ins,chain])=>setD({counts,hs,ins,chain})).catch(()=>{});},[]);
  if(!d) return html`<div class="empty">Loading…</div>`;
  const rescue=async()=>{toast("Rescuing…");await api("/api/rescue",{method:"POST",body:JSON.stringify({systems:["salesforce_agentforce","chatgpt_enterprise","intercom_fin","email_ingest"],clean:true})});toast("Recovered!");reload();};
  const stat=(k,v,s)=>html`<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  return html`<div>
    <h1>Your company's AI brain</h1><p class="sub">One memory you own, that every AI plugs into.</p>
    <div class="card flow">
      <span class="node">Salesforce</span>→<span class="node">Copilot</span>→<span class="node">ChatGPT</span>→
      <span class="node" style=${{borderColor:"var(--brand)"}}>🧠 MemoryVault</span>→<span class="node">every AI in sync</span>
    </div>
    <div class="grid g4" style=${{marginTop:"16px"}}>
      ${stat("Active memories",d.counts.active||0,"shared brain")}
      ${stat("Health",d.hs.score+" "+d.hs.grade,"freshness "+Math.round(d.hs.freshness*100)+"%")}
      ${stat("Held for review",d.counts.quarantined||0,"poison defense")}
      ${stat("Tamper check",d.chain.intact?"PASS ✓":"FAIL ✗","chain integrity")}
    </div>
    <div class="grid g2" style=${{marginTop:"16px"}}>
      <div class="card"><h3>🔔 Signal alerts</h3>${(d.ins.signals||[]).slice(0,4).map(s=>html`<div class="mem" key=${s.pattern}><b class="chip warn">${s.count}×</b> ${s.pattern} — <span class="s">"${s.example}"</span></div>`)}</div>
      <div class="card"><h3>⚡ Actions</h3>
        <div class="row" style=${{flexDirection:"column",alignItems:"stretch"}}>
          <button class="btn" onClick=${rescue}>Run Rescue</button>
          <button class="btn ghost" onClick=${async()=>{await api("/api/sync",{method:"POST"});toast("Synced");reload();}}>Sync every AI</button>
          <button class="btn ghost" onClick=${async()=>{const r=await api("/api/clean",{method:"POST"});toast("Cleaned "+r.dedupe.merged+" dup");reload();}}>Run Cleaner</button>
        </div></div>
    </div></div>`;
}

function Search({toast}){
  const [q,setQ]=useState("acme");const [res,setRes]=useState([]);
  const run=useCallback(async()=>{try{const d=await api("/api/memories?q="+encodeURIComponent(q)+"&agent=admin&limit=100");setRes(d.memories);}catch(e){}},[q]);
  useEffect(()=>{run();},[]);
  return html`<div><h1>Search the brain</h1><p class="sub">Everything your AIs know — one search.</p>
    <div class="row"><input value=${q} onInput=${e=>setQ(e.target.value)} onKeyDown=${e=>e.key==="Enter"&&run()} style=${{flex:1}} placeholder="Search…"/><button class="btn" onClick=${run}>Search</button></div>
    <div style=${{marginTop:"14px"}}>${res.length?res.map(m=>html`<div class="mem" key=${m.id}>
      <div>${m.content}</div>
      <div class="meta"><span class="chip">${m.namespace}</span><span class="chip">${(m.provenance||{}).source_system}</span><span class="chip">trust ${(m.trust||0).toFixed(2)}</span>${m.bias_risk?html`<span class="chip bad">bias</span>`:""}
        <span style=${{marginLeft:"auto"}}></span>
        <button class="btn red sm" onClick=${async()=>{await api("/api/memories/"+m.id,{method:"DELETE"});toast("Deleted");run();}}>Delete</button></div>
    </div>`):html`<div class="empty">No memories — run Rescue from Overview.</div>`}</div></div>`;
}

function Approvals({toast,reload}){
  const [d,setD]=useState(null);
  const load=useCallback(()=>api("/api/approvals").then(setD).catch(()=>{}),[]);
  useEffect(()=>{load();},[]);
  if(!d) return html`<div class="empty">Loading…</div>`;
  const act=async(id,ok)=>{await api("/api/approvals/"+id+"/"+(ok?"approve":"reject"),{method:"POST"});toast(ok?"Approved":"Rejected");load();reload();};
  return html`<div><h1>Approval Room <span class="chip warn">${d.count}</span></h1>
    <p class="sub">Untrusted-source memories held OUT of the brain until a human approves — blocks poisoning attacks.</p>
    ${d.memories.length?d.memories.map(m=>html`<div class="mem" key=${m.id} style=${{borderColor:"var(--warn)"}}>
      <div>⚠ ${m.content}</div>
      <div class="meta"><span class="chip bad">${(m.provenance||{}).source_system}</span><span class="chip">via ${(m.provenance||{}).channel}</span>
        <span style=${{marginLeft:"auto"}}></span>
        <button class="btn sm" onClick=${()=>act(m.id,1)}>Approve</button>
        <button class="btn red sm" onClick=${()=>act(m.id,0)}>Reject</button></div>
    </div>`):html`<div class="empty">Nothing waiting. 🎉</div>`}</div>`;
}

function Insights(){
  const [d,setD]=useState(null);
  useEffect(()=>{api("/api/insights?days=180").then(setD).catch(()=>{});},[]);
  if(!d) return html`<div class="empty">Loading…</div>`;
  return html`<div><h1>Insights</h1><p class="sub">What only we can see — all AI knowledge in one place.</p>
    <div class="card"><h3>📚 Learned (180d)</h3><div class="v">${d.learned.memories_learned}</div>
      <div class="row" style=${{marginTop:"10px"}}>${d.learned.top_themes.map(([w,n])=>html`<span class="chip" key=${w}>${w} · ${n}</span>`)}</div></div>
    <div class="grid g2" style=${{marginTop:"16px"}}>
      <div class="card"><h3>🔔 Signals</h3>${d.signals.map(s=>html`<div class="mem" key=${s.pattern}><b class="chip warn">${s.count}×</b> ${s.pattern}</div>`)}</div>
      <div class="card"><h3>🗺️ Blind spots</h3>${Object.entries(d.blind_spots).map(([ns,x])=>html`<div class="mem" key=${ns}><b>${ns}</b> <span class=${"chip "+(x.risk==="high"?"bad":x.risk==="medium"?"warn":"ok")}>${x.risk}</span> <span class="s">${x.count} mem · ${x.avg_age_days}d</span></div>`)}</div>
    </div></div>`;
}

function Connect({toast}){
  const [d,setD]=useState(null);
  const [name,setName]=useState("");const [base,setBase]=useState("");const [field,setField]=useState("content");
  const load=useCallback(()=>api("/api/connectors").then(setD).catch(()=>{}),[]);
  useEffect(()=>{load();},[]);
  if(!d) return html`<div class="empty">Loading…</div>`;
  const add=async()=>{
    if(!name||!base){toast("name + base URL required");return;}
    await api("/api/connectors",{method:"POST",body:JSON.stringify({name,kind:"rest",
      config:{base_url:base,extract_path:"/",field_map:{content:field}}})});
    toast("Connected "+name);setName("");setBase("");load();};
  const ingestUrl=location.origin+d.ingest_url;
  return html`<div>
    <h1>Connect any AI</h1><p class="sub">Not just the big ones — connect ANY tool: a PDF-maker AI, a transcription AI, anything. Three ways:</p>
    <div class="grid g2">
      <div class="card"><h3>1 · Add any AI with an API</h3>
        <p class="s">Point us at any tool's API — no code.</p>
        <div class="row" style=${{flexDirection:"column",alignItems:"stretch",gap:"8px"}}>
          <input placeholder="Name (e.g. pdfmaker_ai)" value=${name} onInput=${e=>setName(e.target.value)}/>
          <input placeholder="API base URL (https://api.tool.com)" value=${base} onInput=${e=>setBase(e.target.value)}/>
          <input placeholder="Which field holds the text? (e.g. summary)" value=${field} onInput=${e=>setField(e.target.value)}/>
          <button class="btn" onClick=${add}>Connect this AI</button>
        </div></div>
      <div class="card"><h3>2 · Webhook inbox (push from anything)</h3>
        <p class="s">Any tool — directly or via Zapier/Make — POSTs what it learns here. Works with 6000+ apps.</p>
        <div class="mem" style=${{fontSize:"12px",wordBreak:"break-all"}}>POST ${ingestUrl}<br/>header <code>x-ingest-token: ${d.ingest_token.slice(0,16)}…</code></div>
        <button class="btn ghost sm" onClick=${()=>{navigator.clipboard?.writeText(ingestUrl);toast("URL copied");}}>Copy URL</button>
      </div>
    </div>
    <div class="card" style=${{marginTop:"16px"}}><h3>3 · Upload an export</h3>
      <p class="s">Every tool can export something. Drop a JSON/CSV file — we normalize the mess into memories.</p>
      <input type="file" onChange=${async e=>{const f=e.target.files[0];if(!f)return;const txt=await f.text();
        const r=await fetch(location.origin+"/api/upload",{method:"POST",headers:{"x-api-key":KEY,"x-filename":f.name},body:txt});
        const j=await r.json();toast("Imported "+(j.added||0)+" memories");}}/>
    </div>
    <h3 style=${{marginTop:"20px"}}>Connected AIs</h3>
    <div class="row" style=${{flexWrap:"wrap"}}>
      ${d.available.map(a=>html`<span class="chip" key=${a}>${a}${d.live_env.includes(a)?" ✓live":""}</span>`)}
      ${d.custom.map(cn=>html`<span class="chip ok" key=${cn.name}>${cn.name} (custom)</span>`)}
    </div>
  </div>`;
}

function App(){
  const [tab,setTab]=useState("Overview");
  const [h,setH]=useState(null);
  const [toastMsg,setToastMsg]=useState("");
  const [nonce,setNonce]=useState(0);
  const toast=m=>{setToastMsg(m);setTimeout(()=>setToastMsg(""),2500);};
  const reload=()=>setNonce(n=>n+1);
  const refreshH=useCallback(()=>api("/api/health-score").then(setH).catch(()=>{}),[]);
  useEffect(()=>{refreshH();},[nonce]);
  const tabs=["Overview","Search","Connect","Approvals","Insights"];
  const view={Overview,Search,Connect,Approvals,Insights}[tab];
  return html`<${React.Fragment}>
    <header>
      <div class="logo"><span class="dot"></span>MemoryVault <span style=${{fontSize:"11px",color:"var(--dim)",fontWeight:400}}>React</span></div>
      <nav>${tabs.map(t=>html`<button key=${t} class=${t===tab?"active":""} onClick=${()=>setTab(t)}>${t}</button>`)}</nav>
      <div class="gauge"><div style=${{textAlign:"right"}}><div style=${{fontSize:"11px",color:"var(--dim)"}}>MEMORY HEALTH</div><div style=${{fontWeight:800}}>${h?h.score+" · "+h.grade:"—"}</div></div><${Gauge} h=${h}/></div>
    </header>
    <main key=${nonce}>${React.createElement(view,{toast,reload})}</main>
    ${toastMsg?html`<div class="toast">${toastMsg}</div>`:""}
  <//>`;
}

async function boot(){
  if(!KEY){try{KEY=(await (await fetch(API+"/api/demo-key")).text()).trim();localStorage.setItem("mv_key",KEY);}catch(e){}}
  createRoot(document.getElementById("root")).render(html`<${App}/>`);
}
boot();
</script>
</body>
</html>
