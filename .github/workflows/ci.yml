name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Smoke-test API + demo
        run: |
          python demo.py > /dev/null
          python -c "from fastapi.testclient import TestClient; import memoryvault.api as A; c=TestClient(A.app); assert c.get('/api/health').status_code==200; print('API health OK')"
