# One command runs the whole product:  docker compose up
#
# 'app' is the MemoryVault API + Control Room (SQLite by default, zero setup).
# 'postgres' is the production backend (pgvector) — wired and ready; set
# DATABASE_URL to switch the store driver to it.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      MV_DATA: /data
      # MV_ENCRYPT: "1"                 # encrypt content at rest
      # DATABASE_URL: postgres://mv:mv@postgres:5432/memoryvault
      # MV_EMBEDDINGS: openai           # use real embeddings (needs key)
    volumes:
      - mv_data:/data
    depends_on:
      - postgres

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mv
      POSTGRES_PASSWORD: mv
      POSTGRES_DB: memoryvault
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  mv_data:
  pg_data:
